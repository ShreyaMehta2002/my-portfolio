<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Site Visit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== NOVA Homes — branded background + one centred card ===== */
:root{
  --red:#0b6e4f;--red-d:#095c41;--red-50:#e6f4ef;--red-100:#c9e9dd;
  --ink:#12161a;--ink-2:#3a424c;--muted:#6b7280;--soft:#9ca3af;
  --line:#e5e7eb;--line-2:#d1d5db;--fill:#f8f9fb;--slate:#2a2f36;
  --green:#16a34a;--green-50:#f0fdf4
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,sans-serif;font-size:14px;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 500px at 85% 10%,rgba(11,110,79,.30),transparent 60%),
    radial-gradient(700px 500px at 10% 90%,rgba(255,255,255,.07),transparent 60%),
    linear-gradient(160deg,#232830 0%,#2a2f36 45%,#1c2026 100%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
/* faint house outlines in the background */
body::after{content:"";position:fixed;right:-40px;bottom:-30px;width:520px;height:340px;pointer-events:none;opacity:.07;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 520 340' fill='none' stroke='white' stroke-width='3'><path d='M20 330V170L140 70l120 100v160'/><path d='M100 330v-90h80v90'/><path d='M240 330V200l110-90 110 90v130'/><path d='M320 330v-70h60v70'/><path d='M0 330h520'/></svg>") no-repeat bottom right/contain}
button{font-family:inherit}
[hidden]{display:none!important}

/* centred card */
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;z-index:1}
.box{width:100%;max-width:720px;background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;transition:max-width .3s}
.box.wide{max-width:920px}

/* card header: logo + steps */
.box-h{display:flex;align-items:center;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px;letter-spacing:1px;line-height:1;color:var(--ink)}.logo b{color:var(--red)}
.logo small{display:block;font-size:7.5px;letter-spacing:6px;font-weight:700;color:var(--muted);margin-top:3px}
.back{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 8px;border:1px solid var(--line-2);border-radius:8px;background:#fff;color:var(--ink-2);font-size:13px;font-weight:500;cursor:pointer;order:3}
.back::after{content:"Back"}
.back:hover{background:var(--fill)}
.stepper{display:flex;align-items:center;flex:1;justify-content:center;gap:0;order:2}
.st{display:flex;align-items:center;gap:7px}
.st i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--line-2);color:var(--soft);background:#fff}
.st span{font-size:12.5px;color:var(--soft);font-weight:500;white-space:nowrap}
.st.cur i{background:var(--red);border-color:var(--red);color:#fff}
.st.cur span{color:var(--ink);font-weight:600}
.st.ok i{background:var(--ink);border-color:var(--ink);color:#fff}
.st.ok span{color:var(--ink-2)}
.bar{width:28px;height:2px;background:var(--line);margin:0 8px;border-radius:2px}
.bar.ok{background:var(--ink)}
@media(max-width:760px){.st span{display:none}.st.cur span{display:inline}}

/* card body */
.wrap{padding:28px 32px 30px}
.screen{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:none;border:0;padding:0}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--red);background:var(--red-50);border-radius:999px;padding:4px 10px;margin-bottom:10px}
.h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;line-height:1.55}
.lead b{color:var(--ink)}

/* roles */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;color:inherit;position:relative;transition:.15s}
.role:hover{border-color:var(--red);box-shadow:0 10px 26px rgba(17,24,39,.08);transform:translateY(-2px)}
.role.con:hover{border-color:var(--slate)}
.role-ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;margin-bottom:4px}
.role-ic.sup{background:var(--red-50);color:var(--red)}.role-ic.con{background:#eef0f3;color:var(--slate)}
.role>div:nth-child(2){display:flex;flex-direction:column;gap:4px}
.role b{font-size:16px}.role small{color:var(--muted);font-size:13px}
.role .via{align-self:flex-start;margin-top:8px;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--fill);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
.role .arr{position:absolute;top:20px;right:20px;width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--soft);display:grid;place-items:center;transition:.15s}
.role:hover .arr{background:var(--red);color:#fff}.role.con:hover .arr{background:var(--slate)}
.secure{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;color:var(--soft);font-size:12.5px}
@media(max-width:600px){.roles{grid-template-columns:1fr}}

/* inputs */
.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 8px}
.lbl i{color:var(--red);font-style:normal}
.in{width:100%;height:46px;border:1px solid var(--line-2);border-radius:8px;background:#fff;font:14px Inter;color:var(--ink);padding:0 14px;transition:.15s}
.in::placeholder{color:var(--soft)}
.in:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
textarea.in{height:auto;padding:12px 14px;line-height:1.55;resize:vertical}
.code-in{height:54px;text-align:center;font-size:20px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.phone{display:flex;gap:8px}
.cc{width:96px;flex-shrink:0;border:1px solid var(--line-2);border-radius:8px;background:var(--fill);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600}
.hint{display:block;font-size:12.5px;color:var(--soft);margin-top:10px}
.err{display:none;align-items:center;gap:6px;color:var(--red);font-size:13px;font-weight:500;margin-top:8px}
.btn{width:100%;height:48px;border:0;border-radius:8px;background:var(--red);color:#fff;font:600 15px Inter;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;transition:.15s}
.btn:hover{background:var(--red-d)}
.btn:disabled{background:#9bc9b6;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--fill)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* OTP */
.sentto{display:flex;align-items:center;gap:10px;background:var(--fill);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:-6px 0 18px;font-size:13px}
.sentto i{font-style:normal}
.sentto a{margin-left:auto;color:var(--red);font-weight:600;cursor:pointer}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.otp input{width:100%;height:58px;border:1px solid var(--line-2);border-radius:8px;text-align:center;font:700 22px Inter}
.otp input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.resend{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
.resend a{color:var(--red);font-weight:600;cursor:pointer}

/* identity */
.who{display:flex;align-items:center;gap:12px;background:var(--fill);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:20px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.av.sup{background:var(--red-100);color:var(--red)}.av.con{background:#e5e7eb;color:var(--slate)}
.who>div:nth-child(2){min-width:0}
.who b{display:block;font-size:14px}
.who small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verified{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--green)}
.verified::before{content:"✓"}
.tag{margin-left:auto;font-size:12px;font-weight:700;border-radius:6px;padding:5px 10px;background:var(--slate);color:#fff;white-space:nowrap}
.tag.con{background:#e5e7eb;color:var(--slate)}

/* search */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--soft)}
.search .in{padding-left:42px;height:48px}
.sec-cap{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);margin:20px 0 8px}
.results{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res{display:grid;grid-template-columns:40px 1fr auto 16px;align-items:center;gap:14px;width:100%;background:#fff;border:0;border-bottom:1px solid var(--line);padding:13px 16px;text-align:left;cursor:pointer;color:inherit;transition:.12s}
.res:last-child{border-bottom:0}
.res::after{content:"›";font-size:20px;color:var(--soft)}
.res:hover{background:var(--red-50)}.res:hover::after{color:var(--red)}
.res-ic{width:40px;height:40px;border-radius:8px;background:var(--fill);border:1px solid var(--line);color:var(--ink-2);display:grid;place-items:center}
.res>div:nth-child(2){min-width:0}
.res b{display:block;font-size:14px}.res small{color:var(--muted);font-size:12.5px}
.res .no{font-size:12.5px;font-weight:700;color:var(--red);background:var(--red-50);border-radius:6px;padding:4px 9px}
.res mark{background:#fde68a;color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:32px 10px;border:1px dashed var(--line-2);border-radius:10px}
.empty div{font-size:26px;margin-bottom:6px}

/* report */
.ctx{display:flex;align-items:center;gap:14px;background:var(--slate);color:#fff;border-radius:10px;padding:14px 16px;margin-bottom:22px}
.ctx .res-ic{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.ctx>div:nth-child(2){flex:1;min-width:0}
.ctx b{display:block;font-size:15px}.ctx small{font-size:12.5px;opacity:.7}
.ctx button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:6px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
.ctx button:hover{background:rgba(255,255,255,.08)}
.fcard{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:190px 1fr;gap:20px}
@media(max-width:760px){.fcard{grid-template-columns:1fr;gap:12px}}
.fcard h3{margin:0;font-size:14.5px;display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;align-content:flex-start}
.fcard h3 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:11.5px;display:grid;place-items:center}
.fcard h3 em{flex-basis:100%;padding-left:34px;margin-top:-6px;font-style:normal;font-size:12px;font-weight:500;color:var(--soft)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.type{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:13.5px;transition:.15s}
.type:hover{border-color:var(--ink-2)}
.type input,.ch input{display:none}
.type span,.ch span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex-shrink:0;transition:.15s}
.type.on{border-color:var(--red);background:var(--red-50);font-weight:600}
.type.on span,.ch label.on span{border:6px solid var(--red)}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{padding-top:0;border-top:0}
.qt{font-size:14px;font-weight:600;margin-bottom:10px}.qt i{color:var(--red);font-style:normal}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.ch label{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:13.5px;transition:.15s}
.ch label:hover{border-color:var(--ink-2)}
.ch label.on{border-color:var(--red);background:var(--red-50);color:var(--red-d);font-weight:600}
#ups{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.up+.up{margin-top:0}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;border:1.5px dashed var(--line-2);border-radius:10px;padding:18px 12px;cursor:pointer;transition:.15s;min-height:118px}
.drop:hover,.drop.drag{border-color:var(--red);background:var(--red-50)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop-ic{width:40px;height:40px;border-radius:50%;background:var(--fill);border:1px solid var(--line);color:var(--muted);display:grid;place-items:center}
.drop:hover .drop-ic{color:var(--red)}
.drop b{font-size:13px}.drop small{font-size:11.5px;color:var(--soft)}
.drop .plus{display:none}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prev div{position:relative}.prev img{width:58px;height:58px;object-fit:cover;border-radius:6px;display:block}
.prev button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:var(--ink);color:#fff;font-size:9px;cursor:pointer}
.sticky{display:flex;justify-content:flex-end;margin:0 -32px -30px;padding:16px 32px;background:var(--fill);border-top:1px solid var(--line)}
.sticky .btn{width:auto;min-width:200px;margin-top:0}

/* done */
.done{text-align:center;padding:8px 0}
.tick{width:72px;height:72px;border-radius:50%;background:var(--green-50);color:var(--green);display:grid;place-items:center;margin:0 auto 16px;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.done p{color:var(--muted);max-width:420px;margin:0 auto;line-height:1.6}
.receipt{margin:24px auto 0;border:1px solid var(--line);border-radius:10px;text-align:left;display:grid;grid-template-columns:1fr 1fr;max-width:540px}
.receipt div{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.receipt div:nth-child(odd){border-right:1px solid var(--line)}
.receipt div:nth-last-child(-n+2){border-bottom:0}
.receipt span{font-size:12px;color:var(--muted)}
.receipt .refv{color:var(--red)}
.done .btn{max-width:540px;margin:20px auto 0}

/* card footer */
.box-f{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 28px;background:var(--fill);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.box-f a{color:var(--ink-2);font-weight:600;text-decoration:none}
.below{margin-top:16px;color:rgba(255,255,255,.55);font-size:12px}
@media(max-width:600px){.wrap{padding:22px 18px}.box-h{padding:14px 18px}.sticky{margin:0 -18px -22px;padding:14px 18px}.sticky .btn{width:100%}.receipt{grid-template-columns:1fr}.receipt div{border-right:0!important}}
#stepno,#track,.secure{display:none!important}
.drop b,.drop small{display:block}
.box{transition:none}
/* sections stacked: heading row, then full-width fields */
.fcard{grid-template-columns:1fr!important;gap:14px!important;padding-bottom:24px!important}
.fcard h3{align-items:center!important;flex-wrap:nowrap!important}
.fcard h3 em{flex-basis:auto!important;padding:0!important;margin:0 0 0 auto!important;font-size:11.5px!important;font-weight:600!important;color:var(--muted)!important;background:var(--fill);border:1px solid var(--line);border-radius:999px;padding:3px 10px!important}
.types{grid-template-columns:repeat(2,1fr)!important;gap:12px!important}
@media(max-width:600px){.types{grid-template-columns:1fr!important}}
.type{gap:12px!important;padding:14px 16px!important;border-radius:10px!important;border:1.5px solid var(--line)!important;align-items:center}
.type:hover{border-color:var(--line-2)!important;background:var(--fill)}
.type .t-ic{width:38px;height:38px;border-radius:10px;background:var(--fill);border:1px solid var(--line);color:var(--ink-2);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.type .t-tx{flex:1;min-width:0}
.type .t-tx b{display:block;font-size:14px;font-weight:600}
.type .t-tx small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.type>span{margin-left:auto}
.type.on{border-color:var(--red)!important;background:var(--red-50)!important;box-shadow:0 0 0 3px var(--red-100)}
.type.on .t-ic{background:var(--red);border-color:var(--red);color:#fff}
.type.on .t-tx b{color:var(--red-d)}
.note-wrap{position:relative}
.note-wrap textarea{min-height:110px;padding-bottom:28px}
.note-cnt{position:absolute;right:12px;bottom:10px;font-size:11.5px;color:var(--soft)}
#ups{display:block!important}
.fcard.up .drop{flex-direction:row!important;justify-content:flex-start!important;text-align:left!important;min-height:0!important;padding:16px 18px!important;gap:14px!important}
.fcard.up .drop .plus{display:inline-flex!important;margin-left:auto;font-size:12.5px;font-weight:600;color:var(--red);border:1px solid var(--red-100);background:#fff;border-radius:6px;padding:6px 12px}
.up-hint{margin:-6px 0 0;font-size:12.5px;color:var(--muted)}
#prog{display:none!important}
.box-h{justify-content:space-between}
</style>
</head>
<body>
<div class="stage">
  <div class="box" id="box">
    <div class="box-h">
      <div class="logo"><b>NOVA</b>HOMES<small>HOMES</small></div>
      <div class="stepper" id="prog"></div>
      <button class="back" id="back" hidden aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <main class="wrap" id="app"></main>
    <div class="box-f"><span>🔒 Secure link · Your details are only used to file this report.</span><span>Need help? <a href="tel:+61412345678">+61 412 345 678</a></span></div>
  </div>
  <div class="below">© 2026 NOVA Homes</div>
</div>
<div id="plabel" hidden></div><div id="track" hidden><i id="trackBar"></i></div><span id="stepno" hidden></span>

<script>
/* ---------------- sample data (would come from the API) ---------------- */
const SUPERVISORS = {

  'SUP-0107': { name: 'Aisha Khan', email: 'aisha.khan@novahomes.com.au', phone: '+61 413 222 019' }
};
const CONTRACTORS = {

  '400123456': { name: 'Sara Patel', company: 'CleanSite Bins', category: 'Waste & Bins', phone: '+61 400 123 456' }
};
const SCHEDULES = [
  { no: '7856', address: 'Lot No. 42 Skyview Terrace', suburb: 'Box Hill', client: 'John Doe' },
  { no: '7812', address: 'Lot 18, 7 Banksia Crescent', suburb: 'Kellyville', client: 'Priya Sharma' },
  { no: '7790', address: 'Lot 5, 22 Harbour View Rd', suburb: 'Rouse Hill', client: 'Liam Chen' },
  { no: '7744', address: 'Lot 321, 22 Test Victoria St', suburb: 'Marsden Park', client: 'Emma Wilson' },
  { no: '7701', address: 'Lot 9, 3 Wattle Way', suburb: 'Box Hill', client: 'Noah Brown' }
];
const DEFAULT_OPTIONS = [
  { name: 'Site Visit', status: 'Active', upload: true, fence: true, bin: true, questions: [{ text: 'Is the site clean and safe?', type: 'Choice', required: true, options: ['Yes', 'No'] }] },
  { name: 'Toilet Compliance', status: 'Active', upload: true, questions: [
    { text: 'Is the toilet serviced?', type: 'Choice', required: true, options: ['Yes', 'No', 'Not sure'] },
    { text: 'Any issues to report?', type: 'Long', required: false }] },
  { name: 'Fence Compliance', status: 'Active', fence: true, questions: [
    { text: 'Are all fence panels secure?', type: 'Choice', required: true, options: ['Yes', 'No'] },
    { text: 'Number of loose panels', type: 'Short', required: false }] },
  { name: 'Bin Compliance', status: 'Active', bin: true, questions: [] }
];
let OPTIONS;
try { OPTIONS = JSON.parse(localStorage.getItem('siteVisitOptions.v2')) || DEFAULT_OPTIONS; } catch { OPTIONS = DEFAULT_OPTIONS; }
OPTIONS = OPTIONS.filter(o => o.status === 'Active'); OPTIONS.forEach(o => o.questions ||= []);

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2);
const I = {
  sup: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a10 10 0 0 1 20 0z"/><path d="M10 8V5a2 2 0 0 1 4 0v3"/><path d="M1 18h22"/></svg>',
  con: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"/></svg>',
  arr: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>',
  home: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>',
  search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>',
  cam: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  check: '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  warn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>'
};
const UPLOADS = [['fence', 'Fence Photos'], ['bin', 'Bin Photos'], ['upload', 'Upload Photos']];

/* ---------------- state + navigation ---------------- */
let S, navStack = [];
function reset() { S = { role: null, user: null, schedule: null, type: '', answers: {}, files: {}, note: '', phone: '' }; navStack = []; }
reset();

const STEPS = { supervisor: ['Who are you', 'Supervisor code', 'Find schedule', 'Report'], contractor: ['Who are you', 'Phone number', 'Verify', 'Find schedule', 'Report'] };
function go(screen, push = true) {
  if (push && S.screen) navStack.push(S.screen);
  S.screen = screen;
  $('back').hidden = !navStack.length || screen === 'done';
  const steps = STEPS[S.role] || STEPS.supervisor;
  const map = { role: 0, code: 1, phone: 1, otp: 2, search: S.role === 'contractor' ? 3 : 2, form: S.role === 'contractor' ? 4 : 3 };
  const idx = map[screen];
  $('prog').innerHTML = screen === 'done' ? '' : steps.map((t, i) => (i ? `<span class="bar ${i <= idx ? 'ok' : ''}"></span>` : '') + `<div class="st ${i < idx ? 'ok' : i === idx ? 'cur' : ''}"><i>${i < idx ? '✓' : i + 1}</i><span>${t}</span></div>`).join('');
  $('track').hidden = $('stepno').hidden = screen === 'done';
  if (screen !== 'done') { $('stepno').innerHTML = `Step ${idx + 1} of ${steps.length} · <b>${steps[idx]}</b>`; $('trackBar').style.width = ((idx + 1) / steps.length * 100) + '%'; }
  $('plabel').textContent = screen === 'done' ? '' : `Step ${idx + 1} of ${steps.length} · ${steps[idx]}`;
  $('box').classList.toggle('wide', screen === 'form');
  SCREENS[screen]();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('back').onclick = () => { const prev = navStack.pop(); if (prev) go(prev, false); };

const busy = (btn, label) => { btn.disabled = true; btn.innerHTML = `<span class="spin"></span>${label}`; };
const showErr = (id, msg) => { const e = $(id); e.innerHTML = I.warn + msg; e.style.display = 'flex'; };
const whoChip = () => S.role === 'supervisor'
  ? `<div class="who"><div class="av sup">${initials(S.user.name)}</div><div><b>${esc(S.user.name)}</b><small>${esc(S.user.email)}</small><span class="verified">Verified supervisor</span></div><span class="tag sup">✓ ${S.user.code}</span></div>`
  : `<div class="who"><div class="av con">${initials(S.user.name)}</div><div><b>${esc(S.user.name)}</b><small>${esc(S.user.company)}</small><span class="verified">Verified contractor</span></div><span class="tag con">${esc(S.user.category)}</span></div>`;

/* ---------------- screens ---------------- */
const SCREENS = {
  role() {
    $('app').innerHTML = `<section class="screen card">
      <span class="eyebrow">👋 Welcome</span>
      <div class="h1">Report a site visit</div>
      <p class="lead">Tell us who you are so we can bring up the right sites for you.</p>
      <div class="roles">
        <button class="role" data-r="supervisor"><div class="role-ic sup">${I.sup}</div><div><b>I'm a Supervisor</b><small>NOVA Homes site staff</small></div><span class="arr">${I.arr}</span></button>
        <button class="role con" data-r="contractor"><div class="role-ic con">${I.con}</div><div><b>I'm a Contractor</b><small>Trade or service partner</small></div><span class="arr">${I.arr}</span></button>
      </div>
      <div class="secure">${I.lock} Your details are only used to file this report.</div>
    </section>`;
    $('app').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { S.role = b.dataset.r; go(S.role === 'supervisor' ? 'code' : 'phone'); });
  },

  code() {
    $('app').innerHTML = `<section class="screen card">
      <span class="eyebrow">🔑 Supervisor sign-in</span>
      <div class="h1">Enter your supervisor code</div>
      <p class="lead">You'll find it on your staff profile, e.g. <b>SUP-0142</b>.</p>
      <div>
        <label class="lbl" for="code">Supervisor code <i>*</i></label>
        <input class="in code-in" id="code" placeholder="SUP-0000" autocomplete="off" maxlength="8">
        <div class="err" id="codeErr"></div>
        <button class="btn" id="go">Continue ${I.arr}</button>
      </div>
    </section>`;
    $('code').focus();
    $('code').oninput = e => { let v = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v.length > 3) v = v.slice(0, 3) + '-' + v.slice(3); e.target.value = v; $('codeErr').style.display = 'none'; };
    $('code').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
    $('go').onclick = () => {
      const c = $('code').value.trim();
      if (!c) return showErr('codeErr', 'Please enter your supervisor code.');
      busy($('go'), 'Checking…');
      setTimeout(() => {
        if (!SUPERVISORS[c]) { $('go').disabled = false; $('go').innerHTML = `Continue ${I.arr}`; return showErr('codeErr', 'We couldn’t find that code. Check it and try again.'); }
        S.user = { ...SUPERVISORS[c], code: c }; go('search');
      }, 600);
    };
  },

  phone() {
    $('app').innerHTML = `<section class="screen card">
      <span class="eyebrow" style="color:var(--red);background:var(--red-50)">📱 Contractor sign-in</span>
      <div class="h1">What's your mobile number?</div>
      <p class="lead">Use the number registered with NOVA Homes. We'll text you a 6-digit code.</p>
      <div>
        <label class="lbl" for="ph">Mobile number <i>*</i></label>
        <div class="phone"><div class="cc">🇦🇺 +61</div><input class="in" id="ph" type="tel" inputmode="numeric" placeholder="412 555 018" value="${esc(S.phone)}"></div>
        <div class="err" id="phErr"></div>
        <div class="hint">ⓘ Demo: try 412 555 018 or 400 123 456</div>
        <button class="btn" id="go">Send code ${I.arr}</button>
      </div>
    </section>`;
    $('ph').focus();
    $('ph').oninput = e => { const d = e.target.value.replace(/\D/g, '').replace(/^0/, '').slice(0, 9); e.target.value = d.replace(/(\d{3})(\d{0,3})(\d{0,3})/, (m, a, b, c) => [a, b, c].filter(Boolean).join(' ')); $('phErr').style.display = 'none'; };
    $('ph').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
    $('go').onclick = () => {
      const d = $('ph').value.replace(/\D/g, '');
      if (d.length < 9) return showErr('phErr', 'Please enter a valid mobile number.');
      busy($('go'), 'Sending…');
      setTimeout(() => {
        if (!CONTRACTORS[d]) { $('go').disabled = false; $('go').innerHTML = `Send code ${I.arr}`; return showErr('phErr', 'This number isn’t registered as a contractor. Contact your supervisor.'); }
        S.phone = $('ph').value; S.pending = CONTRACTORS[d]; go('otp');
      }, 700);
    };
  },

  otp() {
    $('app').innerHTML = `<section class="screen card">
      <span class="eyebrow">✉️ Check your messages</span>
      <div class="h1">Enter the 6-digit code</div>
      <p class="lead">It can take a few seconds to arrive.</p>
      <div class="sentto"><i>💬</i><span>Sent to <b>+61 ${esc(S.phone)}</b></span><a id="editPh">Edit</a></div>
      <div>
        <div class="otp">${Array.from({ length: 6 }, (_, i) => `<input inputmode="numeric" maxlength="1" placeholder=" " data-i="${i}" aria-label="Digit ${i + 1}">`).join('')}</div>
        <div class="err" id="otpErr"></div>
        <button class="btn" id="go">Verify ${I.arr}</button>
        <div class="resend">Didn't get it? <a id="resend">Resend code</a> <span id="timer"></span></div>
        <div class="hint" style="justify-content:center">ⓘ Demo: any 6 digits work</div>
      </div>
    </section>`;
    $('editPh').onclick = () => $('back').click();
    const boxes = [...$('app').querySelectorAll('.otp input')];
    boxes[0].focus();
    boxes.forEach((b, i) => {
      b.oninput = () => { b.value = b.value.replace(/\D/g, ''); if (b.value && boxes[i + 1]) boxes[i + 1].focus(); $('otpErr').style.display = 'none'; if (boxes.every(x => x.value)) $('go').click(); };
      b.onkeydown = e => { if (e.key === 'Backspace' && !b.value && boxes[i - 1]) boxes[i - 1].focus(); };
      b.onpaste = e => { const d = (e.clipboardData.getData('text').match(/\d/g) || []).slice(0, 6); d.forEach((x, j) => boxes[j].value = x); e.preventDefault(); boxes[Math.min(d.length, 5)].focus(); };
    });
    let t = 30; const tick = () => { $('timer') && ($('timer').textContent = t > 0 ? `in ${t}s` : ''); if (t-- > 0) S.otpTimer = setTimeout(tick, 1000); };
    clearTimeout(S.otpTimer); tick();
    $('resend').onclick = () => { if (t > 0) return; t = 30; tick(); };
    $('go').onclick = () => {
      if (!boxes.every(x => x.value)) return showErr('otpErr', 'Enter all 6 digits.');
      busy($('go'), 'Verifying…');
      setTimeout(() => { S.user = S.pending; go('search'); }, 600);
    };
  },

  search() {
    const recent = S.role === 'contractor' ? SCHEDULES.slice(0, 3) : SCHEDULES.slice(0, 2);
    $('app').innerHTML = `<section class="screen">
      ${whoChip()}
      <div class="card">
        <div class="h1">Which site are you reporting on?</div>
        <p class="lead">Search by schedule number, lot, street, suburb or client.</p>
        <div class="search">${I.search}<input class="in" id="q" placeholder="e.g. 7856 or Skyview" autocomplete="off"></div>
        <div id="res"></div>
      </div>
    </section>`;
    const draw = () => {
      const q = $('q').value.trim().toLowerCase();
      const hl = s => q ? esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), m => `<mark>${m}</mark>`) : esc(s);
      const list = q ? SCHEDULES.filter(s => [s.no, s.address, s.suburb, s.client].join(' ').toLowerCase().includes(q)) : recent;
      $('res').innerHTML = `<div class="sec-cap"><span>${q ? 'Results' : S.role === 'contractor' ? 'Your assigned sites' : 'Recent sites'}</span><span>${list.length}</span></div>` +
        (list.length ? `<div class="results">${list.map(s => `<button class="res" data-no="${s.no}"><div class="res-ic">${I.home}</div><div><b>${hl(s.address)}</b><small>${hl(s.suburb)} · ${hl(s.client)}</small></div><span class="no">#${hl(s.no)}</span></button>`).join('')}</div>`
          : `<div class="empty"><div>🔍</div>No schedules match “${esc(q)}”.<br>Check the number and try again.</div>`);
      $('res').querySelectorAll('[data-no]').forEach(b => b.onclick = () => { S.schedule = SCHEDULES.find(s => s.no === b.dataset.no); go('form'); });
    };
    $('q').oninput = draw; draw(); $('q').focus();
  },

  form() {
    $('app').innerHTML = `<section class="screen">
      ${whoChip()}
      <div class="ctx"><div class="res-ic">${I.home}</div><div><b>${esc(S.schedule.address)}</b><small>Schedule #${S.schedule.no} · ${esc(S.schedule.client)}</small></div><button id="change">Change</button></div>

      <div class="fcard"><h3><span class="n">1</span>Request type<em>Required</em></h3>
        <div class="types" id="types"></div><div class="err" id="typeErr"></div></div>
      <div class="fcard" id="qCard" hidden><h3><span class="n">2</span>Questions</h3><div id="qs"></div></div>
      <div id="ups"></div>
      <div class="fcard"><h3><span class="n" id="noteN">2</span>Notes<em>Optional</em></h3>
        <div class="note-wrap"><textarea class="in" id="note" rows="4" maxlength="500" placeholder="Add anything the team should know — e.g. issues found, access problems, follow-ups needed.">${esc(S.note)}</textarea><span class="note-cnt" id="noteCnt">${S.note.length}/500</span></div></div>

      <div class="sticky"><button class="btn" id="submit" style="margin-top:0">Submit report</button></div>
    </section>`;
    $('change').onclick = () => go('search');
    $('note').oninput = e => { S.note = e.target.value; $('noteCnt').textContent = S.note.length + '/500'; };
    drawTypes(); drawParts();
    $('submit').onclick = submit;
  },

  done() {
    const ref = 'SV-' + String(Math.floor(1000 + Math.random() * 9000));
    const photos = Object.values(S.files).reduce((n, a) => n + a.length, 0);
    $('app').innerHTML = `<section class="screen card done">
      <div class="tick">${I.check}</div>
      <div class="h1">Report submitted</div>
      <p>Thanks ${esc(S.user.name.split(' ')[0])}! The NOVA Homes team has been notified.</p>
      <div class="receipt">
        <div><span>Reference</span><b class="refv">${ref}</b></div>
        <div><span>Site</span><b>${esc(S.schedule.address)}</b></div>
        <div><span>Schedule</span><b>#${S.schedule.no}</b></div>
        <div><span>Request type</span><b>${esc(S.type)}</b></div>
        <div><span>Photos</span><b>${photos}</b></div>
        <div><span>Submitted by</span><b>${esc(S.user.name)}</b></div>
      </div>
      <button class="btn ghost" id="again">Report another visit</button>
    </section>`;
    $('again').onclick = () => { const keep = { role: S.role, user: S.user }; reset(); Object.assign(S, keep); navStack = []; S.screen = null; go('search'); };
  }
};

/* ---------------- form parts ---------------- */
function drawTypes() {
  const TI = {
    fence: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 21V7l2-3 2 3v14M16 21V7l2-3 2 3v14M8 10h8M8 16h8"/></svg>',
    bin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 11v6M14 11v6"/></svg>',
    toilet: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 3h10v7H7zM5 10h14a7 7 0 0 1-14 0zM9 17l-1 4h8l-1-4"/></svg>',
    site: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M9 21v-6h6v6"/></svg>'
  };
  const iconFor = n => /fence/i.test(n) ? TI.fence : /bin/i.test(n) ? TI.bin : /toilet/i.test(n) ? TI.toilet : TI.site;
  const meta = o => {
    const p = [['fence', 'fence'], ['bin', 'bin'], ['upload', 'site']].filter(([k]) => o[k]).length;
    return [o.questions.length ? `${o.questions.length} question${o.questions.length > 1 ? 's' : ''}` : 'No questions', p ? `${p} photo set${p > 1 ? 's' : ''}` : 'No photos'].join(' · ');
  };
  $('types').innerHTML = OPTIONS.map(o => `<label class="type ${S.type === o.name ? 'on' : ''}"><input type="radio" name="t" value="${esc(o.name)}" ${S.type === o.name ? 'checked' : ''}>
    <div class="t-ic">${iconFor(o.name)}</div><div class="t-tx"><b>${esc(o.name)}</b><small>${meta(o)}</small></div><span></span></label>`).join('');
  $('types').querySelectorAll('input').forEach(r => r.onchange = () => {
    S.type = r.value; $('typeErr').style.display = 'none';
    $('types').querySelectorAll('.type').forEach(l => l.classList.toggle('on', l.contains(r)));
    drawParts();
  });
}
function drawParts() {
  const o = OPTIONS.find(x => x.name === S.type), qs = o?.questions || [], ups = o ? UPLOADS.filter(([k]) => o[k]) : [];
  $('qCard').hidden = !qs.length;
  const firstUp = qs.length ? 3 : 2; $('noteN').textContent = firstUp + ups.length;

  $('qs').innerHTML = qs.map((q, i) => {
    const v = S.answers[q.text] ?? '';
    const f = q.type === 'Long' ? `<textarea class="in" rows="3" data-q="${esc(q.text)}" placeholder="Your answer">${esc(v)}</textarea>`
      : q.type === 'Choice' ? `<div class="ch">${q.options.map(c => `<label class="${v === c ? 'on' : ''}"><input type="radio" name="q${i}" data-q="${esc(q.text)}" value="${esc(c)}" ${v === c ? 'checked' : ''}><span></span>${esc(c)}</label>`).join('')}</div>`
      : `<input class="in" data-q="${esc(q.text)}" value="${esc(v)}" placeholder="Your answer">`;
    return `<div class="q"><div class="qt">${esc(q.text)}${q.required ? ' <i>*</i>' : ''}</div>${f}<div class="err" id="qErr${i}"></div></div>`;
  }).join('');
  $('qs').querySelectorAll('[data-q]').forEach(el => el.oninput = el.onchange = () => {
    S.answers[el.dataset.q] = el.value;
    if (el.type === 'radio') el.closest('.ch').querySelectorAll('label').forEach(l => l.classList.toggle('on', l.contains(el)));
    el.closest('.q').querySelector('.err').style.display = 'none';
  });

  const UPHINT = { fence: 'Photos of the site fencing — panels, gates and any damage.', bin: 'Photos of the skip / bins showing how full they are.', upload: 'Any other site photos for the team.' };
  $('ups').innerHTML = ups.map(([k, label], i) => `<div class="fcard up">
    <h3><span class="n">${firstUp + i}</span>${label}<em>Optional</em></h3>
    <p class="up-hint">${UPHINT[k]}</p>
    <label class="drop" data-k="${k}"><input type="file" accept="image/*" multiple><div class="drop-ic">${I.cam}</div><div><b>Take photo or upload</b><small>JPG or PNG · up to 10MB each</small></div><span class="plus">＋ Add</span></label>
    <div class="prev" id="pv-${k}"></div></div>`).join('');
  $('ups').querySelectorAll('.drop').forEach(dz => {
    const k = dz.dataset.k, input = dz.querySelector('input');
    ['dragenter', 'dragover'].forEach(e => dz.addEventListener(e, () => dz.classList.add('drag')));
    ['dragleave', 'drop'].forEach(e => dz.addEventListener(e, () => dz.classList.remove('drag')));
    input.onchange = () => { [...input.files].filter(f => f.size <= 10e6).forEach(f => (S.files[k] ||= []).push({ name: f.name, url: URL.createObjectURL(f) })); input.value = ''; drawPrev(k); };
    drawPrev(k);
  });
}
function drawPrev(k) {
  const el = $('pv-' + k); if (!el) return;
  el.innerHTML = (S.files[k] || []).map((f, i) => `<div><img src="${f.url}" alt=""><button type="button" data-i="${i}" aria-label="Remove">✕</button></div>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { S.files[k].splice(b.dataset.i, 1); drawPrev(k); });
}
function submit() {
  document.querySelectorAll('.err').forEach(e => e.style.display = 'none');
  const fail = (id, m) => { showErr(id, m); $(id).scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  if (!S.type) return fail('typeErr', 'Please choose a request type.');
  const o = OPTIONS.find(x => x.name === S.type), qs = o.questions;
  const miss = qs.findIndex(q => q.required && !String(S.answers[q.text] ?? '').trim());
  if (miss > -1) return fail('qErr' + miss, 'This question is required.');
  S.files = Object.fromEntries(UPLOADS.filter(([k]) => o[k]).map(([k]) => [k, S.files[k] || []]));
  busy($('submit'), 'Submitting…');
  setTimeout(() => go('done'), 800);
}

go('role');
</script>
</body>
</html>
